line-length = 100
target-version = "py39"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "E501",  # длину строк контролирует formatter
]

[lint.per-file-ignores]
"notebooks/*" = ["E402"]
# pydantic вычисляет аннотации в рантайме, а синтаксис X | None работает
# только с Python 3.10. У нас 3.9, поэтому в схемах нужен Optional.
"app/api/schemas.py" = ["UP045", "UP007"]

[format]
quote-style = "double"
